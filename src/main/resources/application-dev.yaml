server:
  port: ${SOFT2PREQCGATE1_API_PORT:8031}

spring:
  config:
    import: "optional:file:.idea/.mysettings.ini[.properties]"
  datasource:
    url: ${SOFT2PREQCGATE_DB_URL}
    username: ${SOFT2PREQCGATE_DB_USERNAME}
    password: ${SOFT2PREQCGATE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: Soft2CostHikariPool
      minimum-idle: ${SOFT2PREQCGATE_DB_MIN_IDLE:5}
      maximum-pool-size: ${SOFT2PREQCGATE_DB_MAX_POOL_SIZE:10}
      connection-timeout: ${SOFT2PREQCGATE_DB_CONNECTION_TIMEOUT_MS:30000}
  data:
    redis:
      host: ${SOFT2PREQCGATE_REDIS_HOST:localhost}
      port: ${SOFT2PREQCGATE_REDIS_PORT:6379}
      password: ${SOFT2PREQCGATE_REDIS_PASSWORD}
      database: ${SOFT2PREQCGATE_REDIS_DATABASE:0}
      connect-timeout: ${SOFT2PREQCGATE_REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${SOFT2PREQCGATE_REDIS_TIMEOUT:3s}
  flyway:
    enabled: ${SOFT2PREQCGATE_FLYWAY_ENABLED:false}
    locations: classpath:/db/migration
    baseline-on-migrate: ${SOFT2PREQCGATE_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SOFT2PREQCGATE_FLYWAY_BASELINE_VERSION:0}
    encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

soft2preqcgate1:
  security:
    swagger-enabled: ${SOFT2PREQCGATE1_SWAGGER_ENABLED:false}

  cors:
    allowed-origins:
      - ${SOFT2PREQCGATE1_NEXACRO_ORIGIN:http://localhost:9031}

  auth:
    session-ttl-hours: ${SOFT2PREQCGATE1_SESSION_TTL_HOURS:8}
    login:
      failure-threshold: ${SOFT2PREQCGATE1_LOGIN_FAILURE_THRESHOLD:5}
      lock-minutes: ${SOFT2PREQCGATE1_LOGIN_LOCK_MINUTES:15}
      bcrypt-strength: ${SOFT2PREQCGATE1_BCRYPT_STRENGTH:12}

  bootstrap:
    enabled: ${SOFT2PREQCGATE1_BOOTSTRAP_ENABLED:false}
    company-code: ${SOFT2PREQCGATE1_BOOTSTRAP_COMPANY_CODE:SOFT2PREQCGATE}
    admin-login-id: ${SOFT2PREQCGATE1_ADMIN_LOGIN_ID:ADMIN}
    admin-name: ${SOFT2PREQCGATE1_ADMIN_NAME:SYSTEMMANAGER}
    admin-password: ${SOFT2PREQCGATE1_ADMIN_PASSWORD}

